<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatchAhead</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a23; --panel-2: #1b212c; --line: #262d3a;
    --text: #e8edf5; --muted: #98a3b6; --faint: #6b7688;
    --red: #ff6b6b; --green: #37d39b; --amber: #ffb64a; --accent: #7c8cff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #fff; --panel-2: #f1f3f7; --line: #e0e4ec;
      --text: #12151c; --muted: #5b6575; --faint: #8b94a3;
      --red: #c73a3a; --green: #16794f; --amber: #9a6400; --accent: #4553c9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.5; padding-bottom: 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  header { border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 18px 0; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .tag { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 18px; }
  select, button {
    font-family: var(--sans); font-size: 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 9px 13px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: progress; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

  .banner {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 7px; padding: 11px 14px; font-size: 13px; color: var(--muted); margin-bottom: 18px;
  }
  .banner code { font-family: var(--mono); color: var(--text); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card > h2 {
    margin: 0; padding: 13px 16px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .card > .body { padding: 14px 16px; }
  .card.full { grid-column: 1 / -1; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }

  .pill {
    display: inline-block; font-family: var(--mono); font-size: 11px;
    padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel-2);
  }
  .pill.high { color: var(--green); } .pill.medium { color: var(--amber); } .pill.low { color: var(--faint); }
  .pill.passed { color: var(--green); } .pill.failed { color: var(--red); } .pill.skipped { color: var(--faint); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: var(--mono); font-size: 12px; }

  pre {
    margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    overflow-x: auto; padding: 14px 16px; background: var(--panel-2);
  }
  .diff .add { color: var(--green); }
  .diff .del { color: var(--red); }
  .diff .hunk { color: var(--accent); }
  .diff .meta { color: var(--faint); }

  .note { color: var(--muted); font-size: 13px; }
  .reason { color: var(--faint); font-size: 12px; }
  .empty { color: var(--faint); font-size: 13px; padding: 8px 0; }
  .outcome { font-family: var(--mono); font-size: 13px; padding: 11px 16px; border-top: 1px solid var(--line); }
  .outcome.migrated { color: var(--green); }
  .outcome.validation_failed, .outcome.patch_failed { color: var(--red); }
  .outcome.not_plannable, .outcome.unsupported_change, .outcome.patched_unverified { color: var(--amber); }
  .outcome.no_impact, .outcome.dry_run { color: var(--muted); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo">Patch<span>Ahead</span></div>
      <div class="tag" id="context-line">loading…</div>
      <div class="spacer"></div>
      <div class="tag" id="version"></div>
    </div>
    <div class="wrap" style="padding:0">
      <div class="controls">
        <select id="document" aria-label="Change document"></select>
        <button id="analyze">Analyze</button>
        <button id="migrate" class="primary">Migrate</button>
        <label class="check"><input type="checkbox" id="dry-run" /> dry run</label>
        <label class="check"><input type="checkbox" id="use-llm" /> use LLM</label>
        <span class="note" id="status"></span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="banner">
    PatchAhead never writes to the repository. <b>Migrate</b> copies it to a temporary
    directory, patches the copy, and runs <code id="test-command">its test command</code>
    there. Nothing below is applied or merged — a human approves.
  </div>
  <div id="results"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let context = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function pill(value, cls) {
  return `<span class="pill ${cls || value}">${esc(value)}</span>`;
}

function renderDiff(diff) {
  if (!diff) return '<div class="empty">No diff.</div>';
  const html = diff.split("\n").map((line) => {
    const safe = esc(line);
    if (line.startsWith("+++") || line.startsWith("---")) return `<span class="meta">${safe}</span>`;
    if (line.startsWith("@@")) return `<span class="hunk">${safe}</span>`;
    if (line.startsWith("+")) return `<span class="add">${safe}</span>`;
    if (line.startsWith("-")) return `<span class="del">${safe}</span>`;
    return safe;
  }).join("\n");
  return `<pre class="diff">${html}</pre>`;
}

function renderChange(change) {
  const target = change.target || {};
  const rename = target.symbol && target.replacement
    ? `<dt>rename</dt><dd class="mono">${esc(target.symbol)} → ${esc(target.replacement)}${
        target.owner ? ` <span class="reason">on ${esc(target.owner)}</span>` : ""}</dd>`
    : "";
  return `
    <div class="card">
      <h2>Upstream change</h2>
      <div class="body">
        <dl>
          <dt>title</dt><dd>${esc(change.title)}</dd>
          <dt>kind</dt><dd>${pill(change.kind, "")}</dd>
          <dt>severity</dt><dd>${pill(change.severity)}</dd>
          <dt>read as</dt><dd>${pill(change.confidence)}</dd>
          ${rename}
          ${change.old_behavior ? `<dt>before</dt><dd>${esc(change.old_behavior)}</dd>` : ""}
          ${change.new_behavior ? `<dt>after</dt><dd>${esc(change.new_behavior)}</dd>` : ""}
        </dl>
        <p class="reason">${esc(change.classification_reason)}</p>
        ${change.evidence?.length ? `<details><summary>Evidence from the document</summary>
          <ul class="reason">${change.evidence.map((e) =>
            `<li>${esc(e.quote)}${e.line ? ` <span class="mono">(line ${e.line})</span>` : ""}</li>`
          ).join("")}</ul></details>` : ""}
      </div>
    </div>`;
}

function renderImpact(impact) {
  if (impact.unsupported_reason) {
    return `<div class="card"><h2>Downstream impact</h2>
      <div class="body"><p class="note">${esc(impact.unsupported_reason)}</p></div></div>`;
  }
  if (!impact.findings.length) {
    return `<div class="card"><h2>Downstream impact</h2>
      <div class="body"><div class="empty">No affected code found.</div></div></div>`;
  }
  const rows = impact.findings.map((f) => `
    <tr>
      <td class="mono">${esc(f.reference.path)}:${f.reference.line}</td>
      <td class="mono">${esc(f.symbol)}</td>
      <td class="mono">${esc(f.matched_contract)}</td>
      <td>${pill(f.confidence)}</td>
      <td>${f.patchable ? "yes" : `no <div class="reason">${esc(f.unpatchable_reason)}</div>`}</td>
    </tr>`).join("");
  return `
    <div class="card">
      <h2>Downstream impact</h2>
      <table>
        <thead><tr><th>Location</th><th>Symbol</th><th>Matched</th><th>Confidence</th><th>Patched</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="body">
        <p class="reason">
          Scanned ${impact.files_scanned} file(s) in ${impact.analysis_ms}ms.
          ${impact.related_tests.length
            ? `Relevant tests: <span class="mono">${impact.related_tests.map(esc).join(", ")}</span>`
            : "No tests were mapped to the affected modules."}
        </p>
      </div>
    </div>`;
}

function renderPlan(plan) {
  if (!plan) return "";
  if (plan.blocked_reason) {
    return `<div class="card"><h2>Migration plan</h2><div class="body">
      <p class="note">${esc(plan.blocked_reason)}</p>
      ${plan.skipped.length ? `<ul class="reason">${plan.skipped.map((s) =>
        `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    </div></div>`;
  }
  const rows = plan.transformations.map((t) => `
    <tr>
      <td class="mono">${esc(t.reference.path)}:${t.reference.line}</td>
      <td class="mono">${esc(t.symbol)}</td>
      <td class="mono">${esc(t.old)}</td>
      <td class="mono">${esc(t.new)}</td>
    </tr>`).join("");
  return `
    <div class="card">
      <h2>Migration plan</h2>
      <table>
        <thead><tr><th>Location</th><th>In</th><th>Old</th><th>New</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="body">
        <dl>
          <dt>handler</dt><dd class="mono">${esc(plan.handler)}</dd>
          <dt>risk</dt><dd>${pill(plan.risk)}</dd>
        </dl>
        <p class="reason">${esc(plan.rationale)}</p>
      </div>
    </div>`;
}

function renderValidation(validation) {
  if (!validation) return "";
  const rows = validation.gates.map((g) => `
    <tr>
      <td class="mono">${esc(g.name)}</td>
      <td>${pill(g.status)}</td>
      <td>${esc(g.detail)}</td>
    </tr>`).join("");
  return `
    <div class="card full">
      <h2>Validation — ${validation.verified ? "verified by tests" : "not verified by tests"}</h2>
      <table>
        <thead><tr><th>Gate</th><th>Status</th><th>Detail</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderResult(result, prSummary) {
  return `
    <div class="grid" style="margin-bottom:18px">
      ${renderChange(result.impact.change)}
      ${renderImpact(result.impact)}
      ${renderPlan(result.plan)}
      ${result.proposal?.diff
        ? `<div class="card"><h2>Proposed diff</h2>${renderDiff(result.proposal.diff)}</div>`
        : ""}
      ${renderValidation(result.validation)}
      <div class="card full">
        <div class="outcome ${esc(result.outcome)}">${esc(result.outcome)} — ${esc(result.message)}</div>
        ${prSummary ? `<div class="body"><details>
          <summary>Reviewable pull-request summary (Markdown)</summary>
          <pre>${esc(prSummary)}</pre></details></div>` : ""}
      </div>
    </div>`;
}

function renderAnalysis(data) {
  return data.reports.map((report) => `
    <div class="grid" style="margin-bottom:18px">
      ${renderChange(report.change)}
      ${renderImpact(report)}
    </div>`).join("");
}

async function call(path, params) {
  const query = new URLSearchParams(params).toString();
  const response = await fetch(`${path}?${query}`, { method: "POST" });
  if (!response.ok) {
    const body = await response.json().catch(() => ({ detail: response.statusText }));
    throw new Error(body.detail || `request failed (${response.status})`);
  }
  return response.json();
}

async function act(kind) {
  const document_name = $("document").value;
  if (!document_name) return;
  const buttons = [$("analyze"), $("migrate")];
  buttons.forEach((b) => (b.disabled = true));
  $("status").textContent = kind === "analyze" ? "analyzing…" : "migrating in an isolated copy…";
  $("results").innerHTML = "";
  try {
    if (kind === "analyze") {
      const data = await call("/api/analyze", { document: document_name });
      $("results").innerHTML = renderAnalysis(data);
      $("status").textContent = `${data.total_findings} finding(s)`;
    } else {
      const data = await call("/api/migrate", {
        document: document_name,
        dry_run: $("dry-run").checked,
        use_llm: $("use-llm").checked,
      });
      $("results").innerHTML = data.results
        .map((r, i) => renderResult(r, data.pr_summaries?.[i]))
        .join("");
      $("status").textContent = data.succeeded ? "migrated and verified" : "not accepted";
    }
  } catch (error) {
    $("status").textContent = "";
    $("results").innerHTML = `<div class="card"><div class="body">
      <p class="note">${esc(error.message)}</p></div></div>`;
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

async function init() {
  try {
    context = await (await fetch("/api/context")).json();
  } catch {
    $("context-line").textContent = "could not reach the server";
    return;
  }
  $("version").textContent = `v${context.version}`;
  $("context-line").textContent = context.repo;
  $("test-command").textContent = context.config.test_command;
  $("document").innerHTML = context.documents
    .map((name) => `<option value="${esc(name)}">${esc(name)}</option>`)
    .join("");
  if (!context.documents.length) {
    $("document").innerHTML = '<option value="">no change documents found</option>';
  }
}

$("analyze").addEventListener("click", () => act("analyze"));
$("migrate").addEventListener("click", () => act("migrate"));
init();
</script>
</body>
</html>
