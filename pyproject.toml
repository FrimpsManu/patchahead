[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchahead"
version = "0.2.0"
description = "Find downstream code broken by upstream API changes, propose a minimal migration, and verify it with your tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["migration", "breaking-change", "api", "codemod", "ast", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]

# The core tool has no third-party runtime dependencies on Python 3.11+.
# `tomli` backfills `tomllib` on 3.10 only.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
yaml = ["PyYAML>=6.0"]
sentry = ["sentry-sdk>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# `patchahead demo` migrates a bundled repository whose configured test command
# is `python -m pytest`, and a migration is only verified when tests actually
# run. pytest is therefore part of the demo, not an afterthought -- without it
# every scenario would honestly but uselessly report "the test command could
# not start".
demo = ["patchahead[web]", "pytest>=7.4"]
# `httpx2` is what starlette's TestClient needs; without it the web tests
# error at import rather than skipping, which is not a useful failure.
# `setuptools` is the build backend: it is declared in `[build-system]`, but pip
# builds in an isolated environment and does not leave it behind, and Python
# 3.12+ venvs no longer ship it. `tests/test_packaging.py` builds a real wheel
# with `--no-isolation` so the check is offline and deterministic, which needs
# it present.
dev = ["pytest>=7.4", "ruff>=0.6", "build>=1.2", "httpx2>=0.28", "setuptools>=68"]
all = [
  "patchahead[llm]",
  "patchahead[yaml]",
  "patchahead[sentry]",
  "patchahead[web]",
  "patchahead[demo]",
]

[project.scripts]
patchahead = "patchahead.cli:main"

[project.urls]
Homepage = "https://github.com/FrimpsManu/patchahead"
Repository = "https://github.com/FrimpsManu/patchahead"
Issues = "https://github.com/FrimpsManu/patchahead/issues"
Changelog = "https://github.com/FrimpsManu/patchahead/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `patchahead demo` (the `[demo]` extra) has to work from an install in an empty
# directory, so the page it serves and the repository it migrates ship inside
# the wheel rather than living beside it in a git checkout. `orders-service` is
# not a valid Python identifier, so package discovery skips that subtree and
# these patterns are what actually carry it.
patchahead = [
  "web/static/*",
  "demo/fixtures/changes/*",
  "demo/fixtures/orders-service/*",
  "demo/fixtures/orders-service/*/*",
]

[tool.pytest.ini_options]
# PatchAhead's own tests. The bundled example repository under
# `src/patchahead/demo/fixtures/` is intentionally broken (that is what it
# demonstrates) and is exercised through the engine by the integration tests,
# never collected directly -- which is what `testpaths` guarantees.
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: runs a real test subprocess; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/patchahead/demo/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008",    # function call in default argument -- not used here
  "SIM108",  # ternary instead of if/else, often less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.patchahead]
# PatchAhead's own settings, used when you point PatchAhead at PatchAhead.
test_command = "python -m pytest"
source_dirs = ["src"]
