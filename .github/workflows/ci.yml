name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject.toml claims to support.
        # 3.10 matters specifically because it needs the `tomli` backfill.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev,web,yaml]'
      - name: Run tests
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check src tests evals
      - name: ruff format --check
        run: ruff format --check src tests evals

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Run the evaluation benchmark
        # Non-zero exit if classification accuracy, impact precision, migration
        # success, or a validation gate regresses -- or if a case marked as a
        # known gap has started passing, which means the marker is stale. These
        # are measured, not asserted from a previous run.
        run: python evals/run.py
      - name: Write the benchmark report
        if: always()
        run: python evals/run.py --format markdown --out evaluation-report.md
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation-report.md

  cli:
    name: cli smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: patchahead --help
        run: patchahead --help
      - name: patchahead handlers
        run: patchahead handlers
      - name: patchahead demo --list
        run: patchahead demo --list
      - name: patchahead demo --print-paths resolves the bundled fixtures
        run: |
          patchahead demo --print-paths
          test -d "$(patchahead demo --print-paths | awk '/^repository/ {print $2}')"
          test -d "$(patchahead demo --print-paths | awk '/^changes/ {print $2}')"
      - name: analyze the bundled example
        run: |
          patchahead analyze \
            --repo src/patchahead/demo/fixtures/orders-service \
            --change src/patchahead/demo/fixtures/changes/pagination-cursor.md
      - name: migrate the bundled example end to end
        run: |
          patchahead migrate \
            --repo src/patchahead/demo/fixtures/orders-service \
            --change src/patchahead/demo/fixtures/changes/pagination-cursor.md \
            --no-artifacts
      - name: the bundled repository must be unchanged afterwards
        run: git diff --exit-code src/patchahead/demo/fixtures/
      - name: an unsupported change must exit 3, not 0
        run: |
          printf '### Orders endpoint moved\n\nThe endpoint moved to /v2/orders.\n' > /tmp/change.md
          set +e
          patchahead analyze \
            --repo src/patchahead/demo/fixtures/orders-service --change /tmp/change.md
          actual=$?
          set -e
          if [ "$actual" -ne 3 ]; then
            echo "expected exit 3 (unsupported change), got $actual"
            exit 1
          fi

  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/patchahead --version
          /tmp/clean/bin/patchahead handlers
      - name: The demo must work from the installed package, not just a checkout
        # `patchahead demo` is the first thing a new user runs. If the bundled
        # repository or the UI's page did not make it into the wheel, it fails
        # for everyone who did not clone the repo -- which is everyone.
        run: |
          python -m venv /tmp/demo
          /tmp/demo/bin/pip install "$(ls dist/*.whl)[demo]"
          cd /tmp   # deliberately not the checkout: nothing may resolve relatively
          /tmp/demo/bin/patchahead demo --print-paths
          /tmp/demo/bin/patchahead demo --list
          repo=$(/tmp/demo/bin/patchahead demo --print-paths | awk '/^repository/ {print $2}')
          changes=$(/tmp/demo/bin/patchahead demo --print-paths | awk '/^changes/ {print $2}')
          test -f "$changes/field-rename.md"
          /tmp/demo/bin/patchahead migrate --repo "$repo" \
            --change "$changes/field-rename.md" --no-artifacts
      - name: The web UI page must ship in the wheel
        run: |
          /tmp/demo/bin/python -c "
          from patchahead.web.server import index_path
          page = index_path().read_text()
          assert 'Upstream change' in page, 'the demo UI page is missing its content'
          print('web UI page found at', index_path())
          "
